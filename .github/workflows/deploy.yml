name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx firebase-tools@15.34.0 deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive --project dealsdash-next
